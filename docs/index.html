<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BudT</title>
  <meta name="description" content="BudT: budgeting, expenses and official exchange rates, built for Africa.">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #F3F7F6; --text: #0F1F1C; --muted: #5F6F6B; --brand: #0F766E; }
    @media (prefers-color-scheme: dark) { :root { --bg: #08110F; --text: #ECF5F3; --muted: #93A6A1; --brand: #2DD4BF; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; }
    img { width: 112px; height: 112px; }
    h1 { margin: 12px 0 4px; }
    p { color: var(--muted); margin: 0 0 16px; }
    a { color: var(--brand); font-weight: 600; }
  </style>
</head>
<body>
  <div>
    <img src="icon.svg" alt="BudT app icon">
    <h1>BudT</h1>
    <p>Budgets, expenses and official exchange rates. Your data stays on your phone.</p>
    <a href="privacy-policy.html">Privacy policy</a>
  </div>
</body>
</html>
