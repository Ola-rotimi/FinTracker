<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D1FAE5"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#022C22" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background tile -->
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <circle cx="860" cy="150" r="320" fill="#FFFFFF" opacity="0.05"/>

  <!-- Bars -->
  <g filter="url(#sh)" fill="url(#bar)">
    <rect x="212" y="600" width="128" height="220" rx="28"/>
    <rect x="388" y="500" width="128" height="320" rx="28"/>
    <rect x="564" y="400" width="128" height="420" rx="28" opacity="0.95"/>
  </g>

  <!-- Trend line with arrow -->
  <g filter="url(#sh)" fill="none" stroke="#FBBF24" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="210,520 400,380 540,450 770,250"/>
    <polyline points="650,250 770,250 770,370"/>
  </g>

  <!-- Coin -->
  <g filter="url(#sh)">
    <circle cx="790" cy="700" r="128" fill="url(#coin)"/>
    <circle cx="790" cy="700" r="98" fill="none" stroke="#B45309" stroke-width="10" opacity="0.45"/>
    <!-- Naira sign -->
    <g stroke="#78350F" stroke-width="20" stroke-linecap="round" fill="none">
      <path d="M752 760 V640 L828 760 V640"/>
      <path d="M732 682 H848 M732 718 H848"/>
    </g>
  </g>
</svg>
